<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alertas de atención</title>
<style>
body{margin:0;font:14px system-ui,sans-serif;color:#173c2d} .panel{box-sizing:border-box;background:#edf5ef;border:1px solid #bad6c2;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.info{flex:1;min-width:175px} .heading{font-weight:750;font-size:15px} .status{font-size:13px;margin-top:4px;color:#335b48} button{font:inherit;font-weight:650;border:1px solid #357353;color:#fff;background:#286548;border-radius:8px;padding:9px 13px;cursor:pointer} button:focus-visible{outline:3px solid #3a92cc;outline-offset:2px} .hint{font-size:12px;margin-top:6px;color:#466456}.fresh{background:#fff4d9;border-color:#e4b959}.muted{background:white;color:#286548}
</style></head><body><section id="panel" class="panel"><div class="info"><div class="heading">🔔 Alertas de atención</div><div class="status" id="status" role="status" aria-live="polite">Consultando bandeja…</div><div class="hint" id="hint">Activa el sonido una vez. Mantén abierto el panel.</div></div><button id="toggle" type="button">Activar y probar sonido</button></section>
<script>
'use strict';
const el=id=>document.getElementById(id);
let ctx=null, enabled=false, previous=null, openCount=0, unseen=0;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
function height(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)+4});}
function update(){el('status').textContent=`${openCount} consulta${openCount===1?'':'s'} abierta${openCount===1?'':'s'}`+(unseen?` · ${unseen} nueva${unseen===1?'':'s'} en esta sesión`:'');el('panel').classList.toggle('fresh',unseen>0&&openCount>0);height();}
function chime(){if(!ctx||ctx.state!=='running')return false;const start=ctx.currentTime+0.02;[660,880].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=start+i*0.18;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.14,t+0.025);g.gain.exponentialRampToValueAtTime(0.001,t+0.24);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.25);});return true;}
function showEnabled(on){enabled=on;el('toggle').textContent=on?'Silenciar alertas':'Activar y probar sonido';el('toggle').classList.toggle('muted',on);el('hint').textContent=on?'Sonido activo · comprobación cada 5 s. Mantén este panel abierto.':'Activa el sonido una vez. Mantén abierto el panel.';height();}
el('toggle').addEventListener('click',async()=>{if(enabled){showEnabled(false);return;}try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio no disponible');if(!ctx||ctx.state==='closed')ctx=new AC();await ctx.resume();if(!chime())throw Error('Sonido bloqueado');showEnabled(true);}catch(e){showEnabled(false);el('hint').textContent='No se pudo activar el sonido. Revisa el volumen y permisos del navegador.';height();}});
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.type!=='streamlit:render')return;const a=e.data.args||{};const serial=Number(a.serial),count=Number(a.open_count);if(!Number.isSafeInteger(serial)||serial<0||!Number.isSafeInteger(count)||count<0)return;if(previous!==null&&serial>previous){unseen+=serial-previous;if(enabled&&!chime()){showEnabled(false);el('hint').textContent='El sonido se suspendió. Pulsa Activar y probar sonido.';}}else if(previous!==null&&serial<previous){unseen=0;}previous=serial;openCount=count;if(count===0)unseen=0;update();});
send('streamlit:componentReady',{apiVersion:1});height();new ResizeObserver(height).observe(document.body);
</script></body></html>
